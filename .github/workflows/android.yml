name: Android offline verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android/test-offline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/offline-test.log
            android/app/build/reports/lint-results-debug.html
