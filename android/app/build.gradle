plugins { id 'com.android.application' }
android {
    namespace 'app.boombox.local'
    compileSdk 35
    defaultConfig {
        applicationId 'app.boombox.local'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.2.1'
        testInstrumentationRunner 'app.boombox.local.OfflineTest'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (System.getenv('BOOMBOX_KEYSTORE')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('BOOMBOX_KEYSTORE'))
                storePassword System.getenv('BOOMBOX_STORE_PASSWORD')
                keyAlias 'boombox'
                keyPassword System.getenv('BOOMBOX_STORE_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
    lint { abortOnError true }
}
def bundleWeb = tasks.register('bundleWeb', Sync) {
    from rootProject.file('../web')
    into layout.projectDirectory.dir('src/main/assets/web')
    doFirst { if (!rootProject.file('../web/index.html').isFile()) throw new GradleException('Missing web entry point') }
}
tasks.configureEach { task ->
    if (task.name == 'preBuild' || task.name.toLowerCase().contains('lint') || (task.name.startsWith('merge') && task.name.endsWith('Assets'))) task.dependsOn(bundleWeb)
}
